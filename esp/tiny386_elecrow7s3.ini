[esp]
; WIFI config
ssid = 
pass = 
; hard disk images on the SD card through FatFs, their clusters mapped
; so that a seek reads no FAT: the most KiB the map may take (8 bytes a
; piece of the image), 0 for none; the default is 1024 on the P4, 0 on S3
;fast_seek_kb = 1024

[pc]
bios = /sdcard/bios.bin
vga_bios = /sdcard/vgabios.bin
mem_size = 6M
vga_mem_size = 320K
;fda = FD14BOOT.img
hda = /sdcard/win95.img
;cdb = /sdcard/FD14LIVE.ISO
fill_cmos = 1

[display]
width = 800
height = 480

[cpu]
gen = 3
fpu = 0
